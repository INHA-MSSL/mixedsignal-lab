      <nav class="nav" aria-label="Main navigation">

        <a href="research.html" class="nav-link">Research</a>

          <div class="nav-group">
            <a href="professor.html" class="nav-link">Members</a>
            <details>
              <summary aria-label="Members submenu"></summary>
              <div class="dropdown">
              <a href="professor.html">Professor</a>
              <a href="students.html">Students</a>
              <a href="alumni.html">Alumni</a>
              </div>
            </details>
          </div>
          <div class="nav-group">
            <a href="journal.html" class="nav-link">Publications</a>
            <details>
              <summary aria-label="Publications submenu"></summary>
              <div class="dropdown">
              <a href="journal.html">Journal</a>
              <a href="conference.html">Conference</a>
              <a href="patents.html">Patents</a>
              </div>
            </details>
          </div>
          <div class="nav-group">
            <a href="team-gallery.html" class="nav-link is-active">Gallery</a>
            <details>
              <summary aria-label="Gallery submenu"></summary>
              <div class="dropdown">
              <a href="team-gallery.html">Team Gallery</a>
              <a href="chip-gallery.html" aria-current="page">Chip Gallery</a>
              </div>
            </details>
          </div>
        <a class="nav-link" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

    <div class="banner">
      <h1 class="container">Chip Gallery</h1>
    </div>
    <div class="container gallery-content">

      <nav class="subnav" aria-label="Gallery pages">
        <a href="team-gallery.html">Team Gallery</a>
        <a href="chip-gallery.html" aria-current="page">Chip Gallery</a>
      </nav>
      <div class="gallery-grid chip-gallery-grid">
        <figure class="chip-card">
          <div class="album-cover-frame">
            <img class="album-cover" src="chip_gallery_photo/25_SS28_KGM.png" alt="Hybrid LDO chip die" loading="lazy">
          </div>
          <figcaption class="album-info">
            <h2 class="album-title">Hybrid LDO</h2>
            <p class="album-date"><strong>Process</strong> 28nm</p>
            <p class="album-date"><strong>Published</strong> IEEE TCAS-II (2026)</p>
          </figcaption>
        </figure>
      </div>
    </div>

  <footer>
    <div class="container">Advanced Mixed-Signal Integrated Circuit Lab. · Inha University</div>
