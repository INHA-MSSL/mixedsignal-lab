<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Gallery | AMSIC Lab.</title>
  <!-- styles.css는 모든 페이지의 디자인, menu.js는 드롭다운 닫기 동작을 담당합니다. -->
  <link rel="stylesheet" href="styles.css">
  <script src="menu.js" defer></script>
  <script src="gallery.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- 공통 상단 메뉴. 메뉴를 바꿀 때는 각 HTML의 이 부분을 함께 수정하세요. -->
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">AMSIC Lab.</a>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="research.html" class="nav-link">Research</a>
          <!-- 메뉴 이름의 href는 기본 페이지, details 안의 링크는 화살표를 눌렀을 때 나오는 목록입니다. -->
          <div class="nav-group">
            <a href="professor.html" class="nav-link">Members</a>
            <details>
              <summary aria-label="Members submenu"></summary>
              <div class="dropdown">
              <a href="professor.html">Professor</a>
              <a href="students.html">Students</a>
              <a href="alumni.html">Alumni</a>
              </div>
            </details>
          </div>
          <div class="nav-group">
            <a href="papers.html" class="nav-link">Publications</a>
            <details>
              <summary aria-label="Publications submenu"></summary>
              <div class="dropdown">
              <a href="papers.html">Papers</a>
              <a href="patents.html">Patents</a>
              </div>
            </details>
          </div>
          <div class="nav-group">
            <a href="team-gallery.html" class="nav-link is-active" aria-current="page">Gallery</a>
            <details>
              <summary aria-label="Gallery submenu"></summary>
              <div class="dropdown">
              <a href="team-gallery.html" aria-current="page">Team Gallery</a>
              <a href="chip-gallery.html">Chip Gallery</a>
              </div>
            </details>
          </div>
        <a class="nav-link" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
  
    <!-- 페이지 제목 -->
    <div class="banner">
      <h1 class="container">Team Gallery</h1>
    </div>
  
    <!-- Members와 같은 본문 너비 및 버튼 위쪽 여백 -->
    <div class="container gallery-content">
  
      <nav class="subnav" aria-label="Gallery pages">
        <a href="team-gallery.html" aria-current="page">Team Gallery</a>
        <a href="chip-gallery.html">Chip Gallery</a>
      </nav>
  
      <!-- ========== 2026년 ========== -->
      <section class="gallery-year" aria-labelledby="year-2026">
        <h2 id="year-2026">2026</h2>
  
        <div class="gallery-grid">
  
          <!-- 앨범 1 -->
          <!-- data-images: 이 앨범에서 넘겨볼 사진 목록 -->
          <button
            class="album-card"
            type="button"
            aria-haspopup="dialog"
            data-title="ISOCC 2026"
            data-images='["2026-isocc-1.jpg", "2026-isocc-2.jpg", "2026-isocc-3.jpg"]'
          >
            <!-- src: 카드 밖에서 보이는 대표 사진 -->
            <img
              class="album-cover"
              src="2026-isocc-1.jpg"
              alt="ISOCC 2026 group photo"
              loading="lazy"
            >
  
            <span class="album-info">
              <time class="album-date" datetime="2026-10-13">
                2026.10.13
              </time>
              <span class="album-title">ISOCC 2026</span>
            </span>
          </button>
  
          <!-- 앨범 2 -->
          <button
            class="album-card"
            type="button"
            aria-haspopup="dialog"
            data-title="Teachers' Day"
            data-images='["2026-teachers-1.jpg", "2026-teachers-2.jpg"]'
          >
            <img
              class="album-cover"
              src="2026-teachers-1.jpg"
              alt="Teachers' Day gathering"
              loading="lazy"
            >
  
            <span class="album-info">
              <time class="album-date" datetime="2026-05-15">
                2026.05.15
              </time>
              <span class="album-title">Teachers' Day</span>
            </span>
          </button>
  
          <!-- 앨범 3 -->
          <button
            class="album-card"
            type="button"
            aria-haspopup="dialog"
            data-title="Spring Outing"
            data-images='["2026-spring-1.jpg", "2026-spring-2.jpg"]'
          >
            <img
              class="album-cover"
              src="2026-spring-1.jpg"
              alt="Lab spring outing"
              loading="lazy"
            >
  
            <span class="album-info">
              <time class="album-date" datetime="2026-04-17">
                2026.04.17
              </time>
              <span class="album-title">Spring Outing</span>
            </span>
          </button>
  
          <!-- 같은 연도의 앨범은 button 한 묶음을 복사해 여기에 추가 -->
  
        </div>
      </section>
  
      <!-- ========== 2025년 ========== -->
      <section class="gallery-year" aria-labelledby="year-2025">
        <h2 id="year-2025">2025</h2>
  
        <div class="gallery-grid">
  
          <!-- 사진이 한 장인 앨범도 가능합니다. -->
          <button
            class="album-card"
            type="button"
            aria-haspopup="dialog"
            data-title="Lab Workshop"
            data-images='["2025-workshop-1.jpg"]'
          >
            <img
              class="album-cover"
              src="2025-workshop-1.jpg"
              alt="Lab workshop"
              loading="lazy"
            >
  
            <span class="album-info">
              <time class="album-date" datetime="2025-11-21">
                2025.11.21
              </time>
              <span class="album-title">Lab Workshop</span>
            </span>
          </button>
  
          <!-- 2025년의 다른 앨범을 여기에 추가 -->
  
        </div>
      </section>
  
    </div>
  
    <!-- 모든 앨범이 함께 사용하는 사진 확대 창: 한 번만 넣습니다. -->
    <dialog class="photo-viewer" id="photo-viewer" aria-label="Photo album">
      <div class="viewer-stage">
  
        <button
          class="viewer-button viewer-close"
          type="button"
          aria-label="Close photo viewer"
          autofocus
        >×</button>
  
        <button
          class="viewer-button viewer-prev"
          type="button"
          aria-label="Previous photo"
        >‹</button>
  
        <img class="viewer-photo" id="viewer-photo" alt="">
  
        <button
          class="viewer-button viewer-next"
          type="button"
          aria-label="Next photo"
        >›</button>
  
        <p class="viewer-count" aria-live="polite" aria-atomic="true"></p>
  
      </div>
    </dialog>
  
  </main>

  <footer>
    <div class="container">Advanced Mixed-Signal Integrated Circuit Lab. · Inha University</div>
  </footer>
</body>
</html>
